[advisories]
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016"
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
