name: Label Sync

on:
  push:
    branches: ["testnet-implementation"]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/label-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync repository labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update labels from .github/labels.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import subprocess, yaml
          with open(".github/labels.yml") as f:
              labels = yaml.safe_load(f)
          for l in labels:
              print(f"Syncing {l['name']}")
              subprocess.run(
                  ["gh", "label", "create", l["name"], "--color", l["color"],
                   "--description", l.get("description", ""), "--force"],
                  check=True,
              )
          PY
