services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_NETWORK: ${NEXT_PUBLIC_NETWORK:-TESTNET}
        NEXT_PUBLIC_SOROBAN_RPC_URL: ${NEXT_PUBLIC_SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
        NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: ${NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE:-"Test SDF Network ; September 2015"}
        NEXT_PUBLIC_REGISTRY_CONTRACT_ID: ${NEXT_PUBLIC_REGISTRY_CONTRACT_ID:-CCXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX01}
        NEXT_PUBLIC_BOT_NFT_CONTRACT_ID: ${NEXT_PUBLIC_BOT_NFT_CONTRACT_ID:-CCXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX02}
        NEXT_PUBLIC_ACCRUAL_CONTRACT_ID: ${NEXT_PUBLIC_ACCRUAL_CONTRACT_ID:-CCXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX03}
        NEXT_PUBLIC_MARKETPLACE_CONTRACT_ID: ${NEXT_PUBLIC_MARKETPLACE_CONTRACT_ID:-CCXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX04}
        NEXT_PUBLIC_TOKEN_CONTRACT_ID: ${NEXT_PUBLIC_TOKEN_CONTRACT_ID:-CCXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX05}
        NEXT_PUBLIC_HORIZON_URL: ${NEXT_PUBLIC_HORIZON_URL:-https://horizon-testnet.stellar.org}
        NEXT_PUBLIC_SIMULATION_SOURCE: ${NEXT_PUBLIC_SIMULATION_SOURCE:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
        NEXT_PUBLIC_ANALYTICS_ENABLED: ${NEXT_PUBLIC_ANALYTICS_ENABLED:-false}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      - NODE_ENV=production
      - AM_NETWORK=${AM_NETWORK:-testnet}
      - AM_RPC_URL=${AM_RPC_URL:-https://soroban-testnet.stellar.org}
      - AM_REGISTRY_CONTRACT_ID=${AM_REGISTRY_CONTRACT_ID:-${NEXT_PUBLIC_REGISTRY_CONTRACT_ID:-CCXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX01}}
      - AM_BOT_NFT_CONTRACT_ID=${AM_BOT_NFT_CONTRACT_ID:-${NEXT_PUBLIC_BOT_NFT_CONTRACT_ID:-CCXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX02}}
      - AM_ACCRUAL_CONTRACT_ID=${AM_ACCRUAL_CONTRACT_ID:-${NEXT_PUBLIC_ACCRUAL_CONTRACT_ID:-CCXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX03}}
      - AM_MARKETPLACE_CONTRACT_ID=${AM_MARKETPLACE_CONTRACT_ID:-${NEXT_PUBLIC_MARKETPLACE_CONTRACT_ID:-CCXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX04}}
      - AM_TOKEN_CONTRACT_ID=${AM_TOKEN_CONTRACT_ID:-${NEXT_PUBLIC_TOKEN_CONTRACT_ID:-CCXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX05}}
      - AM_PORT=${AM_PORT:-8765}
      - AM_POLL_INTERVAL_MS=${AM_POLL_INTERVAL_MS:-5000}
      - AM_START_LEDGER=${AM_START_LEDGER:-0}
    volumes:
      - indexer-data:/app/data
    restart: unless-stopped

volumes:
  indexer-data:
