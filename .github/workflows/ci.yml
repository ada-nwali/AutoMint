name: CI

on:
  pull_request:
    branches: [testnet-implementation, main]
  push:
    branches: [testnet-implementation, main]

jobs:
  tracked-build-artifacts:
    name: No gitignored files tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a gitignored path is tracked
        run: |
          tracked_ignored="$(git ls-files -i -c --exclude-standard)"
          if [ -n "$tracked_ignored" ]; then
            echo "The following gitignored files are tracked in git:"
            echo "$tracked_ignored"
            exit 1
          fi

  contracts:
    name: Contracts (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: cargo build wasm
        run: cargo build --target wasm32v1-none --release -p automint-registry -p automint-token -p automint-bot-nft -p automint-accrual -p automint-marketplace
      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: target/wasm32v1-none/release/*.wasm

  bindings-drift:
    name: Bindings drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust toolchain
        run: rustup show
      - name: Install Stellar CLI
        run: cargo install stellar-cli --locked --version 22.0.0 || cargo install stellar-cli --locked
      - name: Generate bindings
        run: bash scripts/generate-bindings.sh
      - name: Fail on drift
        run: git diff --exit-code -- frontend/src/lib/bindings/

  frontend:
    name: Frontend (lint, type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build
