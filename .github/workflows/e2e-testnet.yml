name: E2E against real testnet

# #538 — nightly end-to-end run that boots the production build and exercises
# it against the live Soroban testnet. Pass the real deployed contract IDs as
# workflow_dispatch inputs (or GitHub variables) so the pages talk to actual
# on-chain contracts rather than placeholder addresses.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      testnet_contract_registry:
        description: "Deployed Registry contract ID on testnet (from deployments/testnet.json)"
        required: false
        default: ""
      testnet_contract_bot:
        description: "Deployed BotNFT contract ID on testnet (from deployments/testnet.json)"
        required: false
        default: ""
      testnet_contract_marketplace:
        description: "Deployed Marketplace contract ID on testnet (from deployments/testnet.json)"
        required: false
        default: ""
      testnet_contract_accrual:
        description: "Deployed Accrual contract ID on testnet (from deployments/testnet.json)"
        required: false
        default: ""
      testnet_contract_token:
        description: "Deployed Token contract ID on testnet (from deployments/testnet.json)"
        required: false
        default: ""

defaults:
  run:
    working-directory: frontend

jobs:
  testnet:
    name: Playwright against Soroban testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite against live testnet
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_SIMULATION_SOURCE: ${{ vars.TESTNET_READ_SOURCE_ACCOUNT }}
          NEXT_PUBLIC_REGISTRY_CONTRACT_ID: ${{ github.event.inputs.testnet_contract_registry || vars.TESTNET_CONTRACT_REGISTRY_ID || '' }}
          NEXT_PUBLIC_BOT_NFT_CONTRACT_ID: ${{ github.event.inputs.testnet_contract_bot || vars.TESTNET_CONTRACT_BOT_ID || '' }}
          NEXT_PUBLIC_MARKETPLACE_CONTRACT_ID: ${{ github.event.inputs.testnet_contract_marketplace || vars.TESTNET_CONTRACT_MARKETPLACE_ID || '' }}
          NEXT_PUBLIC_ACCRUAL_CONTRACT_ID: ${{ github.event.inputs.testnet_contract_accrual || vars.TESTNET_CONTRACT_ACCRUAL_ID || '' }}
          NEXT_PUBLIC_TOKEN_CONTRACT_ID: ${{ github.event.inputs.testnet_contract_token || vars.TESTNET_CONTRACT_TOKEN_ID || '' }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
          if-no-files-found: warn